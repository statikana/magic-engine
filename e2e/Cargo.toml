[package]
name = "mtg-engine-e2e"
version = "0.1.0"
edition = "2024"
publish = false
description = "Standalone opaque-box E2E test suite for mtg-engine, mtg-ir, and mtg-cli"

# Empty workspace table keeps `e2e/` decoupled from the root Cargo workspace.
[workspace]

[features]
default = []
# Enable once Milestone M3 adds `verify-layer-cache` to `crates/mtg-engine/Cargo.toml`:
# verify-layer-cache = ["mtg-engine/verify-layer-cache"]
verify-layer-cache = []
# Enable once Milestone M5 adds `decision_info`, `from_replay`, `snapshot_bytes`, `from_snapshot`:
m5-session-ext = []

[dependencies]
mtg-ir = { path = "../crates/mtg-ir" }
mtg-engine = { path = "../crates/mtg-engine" }
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = { version = "1", features = ["serde"] }
