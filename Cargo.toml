[workspace]
resolver = "3"
members = [
    "crates/mtg-ir",
    "crates/mtg-engine",
    "crates/mtg-ai",
    "crates/mtg-compiler",
    "crates/mtg-cli",
    "crates/mtg-wasm",
    "crates/mtg-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/statikana/magic-engine"

[workspace.dependencies]
bitflags = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = { version = "1", features = ["serde"] }
thiserror = "2"
zstd = "0.13"

mtg-ir = { path = "crates/mtg-ir" }
mtg-engine = { path = "crates/mtg-engine" }
mtg-compiler = { path = "crates/mtg-compiler" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
